# 代替PNTシミュレータ コンテナ構成
#   edge    : ソノブイ／機内ノード（信号処理・INSバウンディングEKF）
#   cloud   : 親局／統合解析基盤（ネットワーク統合推定・Dubins計画・LLM状況解析）
#   litellm : LLM APIゲートウェイ（ローカルLLM ⇔ クラウドLLM 切替）
#
# edge と cloud は別ネットワークに分離し、litellm のみが両方に接続する。
# VHFリンク帯域制約（120kbps）は edge の LINK_RATE_BPS で模擬する。

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml:ro
    env_file: [.env]
    ports: ["127.0.0.1:4000:4000"]     # 外部公開しない（SSH トンネル経由で利用）
    networks: [edge_net, cloud_net]
    restart: unless-stopped

  edge:
    build: { context: ., dockerfile: services/edge/Dockerfile }
    environment:
      NODE_ROLE: edge
      LINK_RATE_BPS: "120000"
      LITELLM_BASE_URL: http://litellm:4000
      LLM_MODEL: edge-fast
    env_file: [.env]
    volumes:
      - ./data:/app/data
      - ./out:/app/out
    networks: [edge_net]
    depends_on:
      litellm: { condition: service_started, required: false }   # LLM 無しでもシミュレーションは動く

  cloud:
    build: { context: ., dockerfile: services/cloud/Dockerfile }
    environment:
      NODE_ROLE: cloud
      LITELLM_BASE_URL: http://litellm:4000
      LLM_MODEL: cloud-analyst
    env_file: [.env]
    volumes:
      - ./data:/app/data
      - ./out:/app/out
    ports: ["${CLOUD_BIND:-127.0.0.1}:8080:8080"]   # CLOUD_BIND=0.0.0.0 で外部公開
    networks: [cloud_net]
    restart: unless-stopped
    depends_on:
      litellm: { condition: service_started, required: false }

networks:
  edge_net: {}
  cloud_net: {}

# 主たる作戦海域（第一列島線と第二列島線の間、南限 北緯 15 度、東は東経 150 度付近まで）の面的な評価
skywave_config: skywave_japan.yaml
epoch: {year: 2026, month: 10, ssn: 100}
grid_deg: 1.5
iono_tau_s: {model: 10800, realtime: 1800}
sigma_h_km: {model: 20, realtime: 5}
ground_wave_sigma_km: 0.3

monitor:                          # 電離層の監視網: 各送信所の近くの受信局 ＋ 受信だけの局
  rx_only: {硫黄島: [24.78, 141.32], 南鳥島: [24.29, 153.98]}   # 硫黄島に送信所があれば併設扱い（二重に数えない）
  min_km: 400
  max_km: 4000
  corr_km: {model: 1500, realtime: 500}   # 反射高さのずれの空間相関距離（仮定。要検証）
  sigma_obs_m: 100
  update_s: 60
  latency_s: 60

# 硫黄島: 受信局だけ（送信 5 局）と、送信局も置く（送信 6 局）の 2 通り
cases:
  - {name: "送信 5 局（硫黄島は受信のみ）・補正なし", tx: [青森, 千葉, 広島, 鹿児島, 沖縄], monitor: false}
  - {name: "送信 5 局（硫黄島は受信のみ）・監視網で補正", tx: [青森, 千葉, 広島, 鹿児島, 沖縄], monitor: true}
  - {name: "送信 6 局（硫黄島に送信局）・補正なし", tx: [青森, 千葉, 広島, 鹿児島, 沖縄, 硫黄島], monitor: false}
  - {name: "送信 6 局（硫黄島に送信局）・監視網で補正", tx: [青森, 千葉, 広島, 鹿児島, 沖縄, 硫黄島], monitor: true}

representative:                   # シミュレーションで確かめる代表点
  西部: [23.5, 129.0]
  中央: [25.0, 135.5]
  南部: [17.0, 131.0]
  東部: [25.0, 146.5]
  南東: [18.56, 143.51]
